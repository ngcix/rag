[build-system]
requires = ["setuptools>=61.0", "wheel", "cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1"
description = "RAG project with Cython and PyInstaller"
dependencies = [
    "cython>=3.0.0",
    "pyinstaller>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
requires-python = ">=3.10"

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
