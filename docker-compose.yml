services:
  embedding:
    image: rag-embed

    environment:
      - MODEL_ID=/data/bge-m3  # Chỉ đường dẫn đến thư mục chứa model bên trong container
      - PORT=80
      - MAX_CLIENT_BATCH_SIZE=64
      - MAX_BATCH_TOKENS=16384
    volumes:
      - ./data/models/bge-m3:/data/bge-m3  # Mount thư mục model đã tải từ máy host vào container
    ports:
      - "80:80"
    restart: unless-stopped

    
  rag:
    image: rag-main

    environment:
      RAG_BASE_DIR: /specrag
      EMBEDDING_URL: http://embedding:80