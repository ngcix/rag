services:
  embedding:
    image: rag-embed:latest
    command:
      - --model-id
      - /data/models/Qwen3-Embedding-4B
      - --pooling
      - last-token             # 🌟 Đã sửa từ 'cls' sang 'last-token'
      - --max-client-batch-size
      - "32"
      - --max-batch-tokens     # 🌟 Bổ sung để kiểm soát tải bộ nhớ trên CPU
      - "16384"
      - --auto-truncate
      - --port
      - "80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./data:/data
    ports:
      - "21000:80"
    restart: unless-stopped

  rag:
    image: rag-main

    environment:
      RAG_BASE_DIR: /specrag
      EMBEDDING_URL: http://embedding:80